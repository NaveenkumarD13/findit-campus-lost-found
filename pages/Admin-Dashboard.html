<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindIt — Admin Dashboard</title>

    <link rel="icon" type="image/jpeg" href="../images/findit.jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-glow: rgba(79, 70, 229, 0.35);
            --accent: #06b6d4;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-body: #f6f7fb;
            --bg-nav: rgba(255,255,255,0.85);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-soft: #94a3b8;
            --border-color: #e2e8f0;
            --border-soft: #eef2f7;
            --card-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
            --status-pending-bg: #fef3c7; --status-pending-text: #d97706;
            --status-active-bg: #dbeafe; --status-active-text: #2563eb;
            --status-resolved-bg: #dcfce7; --status-resolved-text: #15803d;
        }
        [data-theme="dark"] {
            --bg-body: #0a0f1e;
            --bg-nav: rgba(15,23,42,0.85);
            --bg-card: #131a2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-soft: #64748b;
            --border-color: #243049;
            --border-soft: #1e293f;
            --card-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.4);
            --status-pending-bg: rgba(217,119,6,0.2); --status-pending-text: #fbbf24;
            --status-active-bg: rgba(37,99,235,0.2); --status-active-text: #60a5fa;
            --status-resolved-bg: rgba(21,128,61,0.2); --status-resolved-text: #4ade80;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        .ambient-bg { position: fixed; inset: 0; z-index: -2; background-image: radial-gradient(circle at center, var(--border-soft) 1px, transparent 1.5px); background-size: 28px 28px; pointer-events: none; }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 6%; background: var(--bg-nav); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .navbar-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 1.35rem; font-weight: 800; color: var(--primary); }
        .navbar-brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: contain; background: #fff; padding: 2px; border: 1px solid var(--border-color); }
        .admin-badge { background: var(--primary); color: #fff; font-size: 0.65rem; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.04em; }
        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); transition: all 0.2s; }
        .btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(79,70,229,0.06); }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-danger:hover { background: #dc2626; color: #fff; }
        .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-success:hover { background: #15803d; color: #fff; }
        .btn-theme-toggle { background: none; border: 1px solid var(--border-color); font-size: 1.1rem; cursor: pointer; color: var(--text-main); padding: 9px; border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .btn-theme-toggle:hover { border-color: var(--primary); color: var(--primary); transform: rotate(20deg); }

        .dashboard-container { max-width: 1300px; margin: 2rem auto; padding: 0 6%; width: 100%; flex: 1; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 16px; }
        .dashboard-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
        .dashboard-header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 2.5rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 22px; border-radius: 16px; box-shadow: var(--card-shadow); display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
        .stat-card:hover { transform: translateY(-6px); border-color: transparent; box-shadow: 0 12px 32px rgba(79,70,229,0.15); }
        .stat-card:hover::before { transform: scaleX(1); }
        .stat-info h3 { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; margin-bottom: 6px; }
        .stat-info p { font-size: 2.2rem; font-weight: 900; color: var(--text-main); letter-spacing: -0.02em; }
        .stat-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }

        .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; gap: 15px; flex-wrap: wrap; }
        .search-box { position: relative; min-width: 280px; flex: 1; }
        .search-box input { width: 100%; padding: 11px 16px 11px 42px; border-radius: 12px; border: 1.5px solid var(--border-color); background: var(--bg-card); color: var(--text-main); outline: none; font-size: 0.9rem; transition: all 0.2s; }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79,70,229,0.1); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .filter-select { padding: 11px 16px; border-radius: 12px; border: 1.5px solid var(--border-color); background: var(--bg-card); color: var(--text-main); outline: none; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .filter-select:focus { border-color: var(--primary); }
        .filter-select option { background: var(--bg-card); color: var(--text-main); }

        .table-wrapper { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow-x: auto; box-shadow: var(--card-shadow); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: var(--border-soft); color: var(--text-muted); padding: 16px 20px; font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border-soft); color: var(--text-main); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr { transition: background-color 0.2s; }
        tr:hover td { background: var(--border-soft); }

        .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; display: inline-block; letter-spacing: 0.04em; }
        .badge-type-lost { background: rgba(239,68,68,0.14); color: var(--danger); }
        .badge-type-found { background: rgba(22,163,74,0.14); color: var(--success); }
        .badge-status-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
        .badge-status-active { background: var(--status-active-bg); color: var(--status-active-text); }
        .badge-status-resolved { background: var(--status-resolved-bg); color: var(--status-resolved-text); }

        .action-btns { display: flex; gap: 8px; }
        .action-btns button { padding: 7px 12px; font-size: 0.78rem; border-radius: 8px; }

        .no-data { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .no-data i { font-size: 2.5rem; margin-bottom: 12px; display: block; color: var(--primary); }

        .toast { position: fixed; top: 80px; right: 24px; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 12px 32px rgba(15,23,42,0.16); max-width: 340px; animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1); }
        .toast.out { animation: toastOut 0.3s forwards; }
        @keyframes toastIn { from { opacity:0; transform: translateX(120%); } to { opacity:1; transform: translateX(0); } }
        @keyframes toastOut { to { opacity:0; transform: translateX(120%); } }
        .toast .ico { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .toast .ico.success { background: rgba(22,163,74,0.14); color: var(--success); }
        .toast .ico.error { background: rgba(239,68,68,0.14); color: var(--danger); }
        .toast .ico.info { background: rgba(79,70,229,0.14); color: var(--primary); }
        .toast .body .t { font-weight:700; font-size:0.85rem; color: var(--text-main); }
        .toast .body .s { font-size:0.75rem; color: var(--text-muted); margin-top:2px; }

        .site-footer { background: #0a0f1e; color: #94a3b8; padding: 18px 6%; margin-top: auto; text-align: center; font-size: 0.82rem; }

        @media (max-width: 768px) { .table-controls { flex-direction: column; align-items: stretch; } .search-box { min-width: 100%; } }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <header class="navbar">
        <a href="../index.html" class="navbar-brand">
            <img src="../images/findit.jpeg" alt="FindIt" onerror="this.style.display='none'">
            <span>FindIt</span>
            <span class="admin-badge">Admin</span>
        </a>
        <div class="nav-actions">
            <button onclick="toggleTheme()" class="btn-theme-toggle" id="themeToggleBtn"><i id="themeToggleIcon" class="fa-solid fa-moon"></i></button>
            <a href="../index.html" class="btn"><i class="fa-solid fa-house"></i> Home</a>
            <button onclick="handleLogout()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1>Admin Control Panel</h1>
                <p>Live tracking of all user submissions from Report Lost &amp; Report Found forms.</p>
            </div>
            <button onclick="loadAdminData()" class="btn"><i class="fa-solid fa-rotate-right"></i> Refresh Data</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info"><h3>Total Reports</h3><p id="statTotal">0</p></div>
                <div class="stat-icon" style="background: rgba(79,70,229,0.12); color: var(--primary);"><i class="fa-solid fa-clipboard-list"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Lost Items</h3><p id="statLost">0</p></div>
                <div class="stat-icon" style="background: rgba(239,68,68,0.12); color: var(--danger);"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Found Items</h3><p id="statFound">0</p></div>
                <div class="stat-icon" style="background: rgba(37,99,235,0.12); color: #2563eb;"><i class="fa-solid fa-box-open"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Recovered</h3><p id="statResolved">0</p></div>
                <div class="stat-icon" style="background: rgba(22,163,74,0.12); color: var(--success);"><i class="fa-solid fa-circle-check"></i></div>
            </div>
        </div>

        <div class="table-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search by title or location..." onkeyup="filterTable()">
            </div>
            <div style="display: flex; gap: 10px;">
                <select class="filter-select" id="typeFilter" onchange="filterTable()">
                    <option value="ALL">All Types</option>
                    <option value="Lost">Lost Only</option>
                    <option value="Found">Found Only</option>
                </select>
                <select class="filter-select" id="statusFilter" onchange="filterTable()">
                    <option value="ALL">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="ACTIVE">Active</option>
                    <option value="RESOLVED">Recovered</option>
                </select>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Item Details</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Date Reported</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </main>

    <footer class="site-footer">&copy; 2026 FindIt Campus Management Portal.</footer>

    <script>
    const savedTheme = localStorage.getItem('findit_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('findit_theme', next);
        document.getElementById('themeToggleIcon').className = next === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }
    document.getElementById('themeToggleIcon').className = savedTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

    document.addEventListener('DOMContentLoaded', () => {
        const u = JSON.parse(localStorage.getItem('findit_logged_user'));
        if (!u || (u.role || '').toLowerCase() !== 'admin') {
            showToast('error', 'Access Denied', 'Admin privileges required.');
            setTimeout(() => window.location.href = 'Login.html', 1500);
            return;
        }
        loadAdminData();
    });

    function animateCount(el, target) {
        if (!el) return;
        const dur = 900;
        const start = performance.now();
        function frame(now) {
            const p = Math.min((now - start) / dur, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(eased * target);
            if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    }

    function loadAdminData() {
        const allReports = JSON.parse(localStorage.getItem('findit_all_reports') || '[]');
        const stats = {
            total: allReports.length,
            lost: allReports.filter(r => r.type === 'Lost').length,
            found: allReports.filter(r => r.type === 'Found').length,
            resolved: allReports.filter(r => r.status === 'RESOLVED').length
        };
        animateCount(document.getElementById('statTotal'), stats.total);
        animateCount(document.getElementById('statLost'), stats.lost);
        animateCount(document.getElementById('statFound'), stats.found);
        animateCount(document.getElementById('statResolved'), stats.resolved);
        renderTable(allReports);
    }

    function renderTable(reports) {
        const tbody = document.getElementById('adminTableBody');
        if (reports.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="no-data"><i class="fa-solid fa-inbox"></i><p><strong>No User Reports Found</strong></p><p>When users submit items, they will appear here automatically.</p></td></tr>`;
            return;
        }
        tbody.innerHTML = reports.map(report => {
            const icon = report.icon || 'fa-box';
            const iconColor = report.type === 'Lost' ? 'var(--danger)' : 'var(--success)';
            const date = report.createdAt ? new Date(report.createdAt).toLocaleDateString() : (report.lostDate || report.foundDate || 'Recently');
            return `
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${report.type === 'Lost' ? 'rgba(239,68,68,0.12)' : 'rgba(22,163,74,0.12)'};color:${iconColor};">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div>
                                <strong>${report.itemName}</strong>
                                <div style="font-size: 0.78rem; color: var(--text-muted);">${report.userName || 'Anonymous'} • ${report.dept || 'General'}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge badge-type-${report.type === 'Lost' ? 'lost' : 'found'}">${report.type}</span></td>
                    <td>${report.location || 'Unknown'}</td>
                    <td>${date}</td>
                    <td><span class="badge badge-status-${(report.status || 'pending').toLowerCase()}">${report.status || 'PENDING'}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-success" onclick="markResolved('${report.id}')"><i class="fa-solid fa-check"></i> Resolve</button>
                            <button class="btn btn-danger" onclick="deleteReport('${report.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const tf = document.getElementById('typeFilter').value;
        const sf = document.getElementById('statusFilter').value;
        let reports = JSON.parse(localStorage.getItem('findit_all_reports') || '[]');
        reports = reports.filter(r => {
            const ms = (r.itemName || '').toLowerCase().includes(q) || (r.location || '').toLowerCase().includes(q);
            const mt = tf === 'ALL' || r.type === tf;
            const mst = sf === 'ALL' || r.status === sf;
            return ms && mt && mst;
        });
        renderTable(reports);
    }

    function markResolved(id) {
        let reports = JSON.parse(localStorage.getItem('findit_all_reports') || '[]');
        const r = reports.find(x => x.id === id);
        if (r) { r.status = 'RESOLVED'; localStorage.setItem('findit_all_reports', JSON.stringify(reports)); loadAdminData(); showToast('success', 'Item Resolved', 'Marked as recovered successfully.'); }
    }

    function deleteReport(id) {
        if (!confirm('Delete this report permanently?')) return;
        let reports = JSON.parse(localStorage.getItem('findit_all_reports') || '[]');
        reports = reports.filter(r => r.id !== id);
        localStorage.setItem('findit_all_reports', JSON.stringify(reports));
        loadAdminData();
        showToast('info', 'Report Deleted', 'The report has been removed.');
    }

    function handleLogout() {
        if (!confirm('Log out of admin session?')) return;
        localStorage.removeItem('findit_logged_user');
        window.location.href = 'Login.html';
    }

    function showToast(type, title, sub) {
        const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<div class="ico ${type}"><i class="fa-solid ${icons[type]}"></i></div><div class="body"><div class="t">${title}</div><div class="s">${sub}</div></div>`;
        document.body.appendChild(el);
        setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3500);
    }
    </script>
</body>
</html>
